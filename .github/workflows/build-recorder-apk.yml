name: Build recorder APK
on:
  push:
    paths: ["recorder-app/**", ".github/workflows/build-recorder-apk.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: recorder-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: LongRecorder-apk, path: recorder-app/app/build/outputs/apk/debug/*.apk }
